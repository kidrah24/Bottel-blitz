[build]
  publish = "dist"
  command = "npm run build"
  functions = "api"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "*"
    Content-Security-Policy = "frame-ancestors *;"
